name: Deploy website
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tokens.css', 'Scripts/build-site.sh', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: ./Scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
